<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดแปลง - เกษตรอัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }

        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between" onload="loadPlotDetail()">

    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html"
                class="flex items-center space-x-2 bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-xl text-white transition">
                <span class="text-2xl">⬅️</span>
                <span class="font-extrabold text-lg">ย้อนกลับ</span>
            </a>
            <a href="login.html" onclick="localStorage.removeItem('farm_user')"
                class="bg-rose-600 hover:bg-rose-700 text-white font-extrabold px-4 py-2 rounded-xl text-base transition">
                🚪 ออกจากระบบ
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 w-full space-y-6">

        <!-- สรุปข้อมูลแปลง -->
        <div class="bg-white rounded-3xl p-6 shadow-md border-2 border-emerald-600 text-center space-y-3">
            <div
                class="inline-block bg-amber-100 text-amber-900 font-extrabold text-lg px-4 py-1 rounded-full border border-amber-300">
                🌱 กำลังปลูกอยู่
            </div>
            <h1 id="detail-plot-name" class="text-3xl sm:text-4xl font-extrabold text-slate-800">🌾 แปลงเกษตร</h1>
            <p id="detail-crop-info" class="text-2xl font-extrabold text-emerald-700">พืช: -</p>
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-200">
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <p class="text-slate-500 font-bold text-base">📅 เริ่มปลูก</p>
                    <p id="detail-start-date" class="text-xl font-extrabold text-slate-800">-</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <p class="text-slate-500 font-bold text-base">🚜 คาดว่าจะเก็บเกี่ยว</p>
                    <p id="detail-harvest-date" class="text-xl font-extrabold text-amber-800">-</p>
                </div>
            </div>
        </div>

        <!-- ปุ่มบันทึกงาน -->
        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-4 no-print">
            <h2 class="text-2xl font-extrabold text-slate-800 border-b pb-3 flex items-center space-x-2">
                <span>📌</span>
                <span>กดบันทึกงานวันนี้ (สัมผัสเดียว)</span>
            </h2>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="recordActivity('💧 สูบน้ำ / รดน้ำ', '💧')"
                    class="bg-blue-50 border-2 border-blue-400 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 active:scale-95 transition">
                    <span class="text-5xl">💧</span>
                    <span class="text-2xl font-extrabold text-blue-900">รดน้ำ / สูบน้ำ</span>
                </button>
                <button onclick="recordActivity('🧪 ใส่ปุ๋ยบำรุง', '🧪')"
                    class="bg-amber-50 border-2 border-amber-400 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 active:scale-95 transition">
                    <span class="text-5xl">🧪</span>
                    <span class="text-2xl font-extrabold text-amber-900">ใส่ปุ๋ย</span>
                </button>
                <button onclick="recordActivity('🐛 พ่นยาสมุนไพร', '🐛')"
                    class="bg-rose-50 border-2 border-rose-400 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 active:scale-95 transition">
                    <span class="text-5xl">🐛</span>
                    <span class="text-2xl font-extrabold text-rose-900">พ่นยาป้องกัน</span>
                </button>
                <button onclick="recordActivity('🌱 ถอนหญ้า / วัชพืช', '🌱')"
                    class="bg-emerald-50 border-2 border-emerald-400 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 active:scale-95 transition">
                    <span class="text-5xl">🌱</span>
                    <span class="text-2xl font-extrabold text-emerald-900">ถอนหญ้า</span>
                </button>
            </div>
        </div>

        <!-- รายการประวัติย้อนหลัง + ปุ่มส่งออก -->
        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-2">
                <h2 class="text-2xl font-extrabold text-slate-800 flex items-center space-x-2">
                    <span>📜</span>
                    <span>ประวัติงานที่ทำไปแล้ว</span>
                </h2>
                <div class="flex space-x-2 no-print">
                    <button onclick="exportCSV()"
                        class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-3 py-1.5 rounded-xl text-sm">
                        📊 โหลด Excel/CSV
                    </button>
                    <button onclick="window.print()"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-xl text-sm">
                        🖨️ พิมพ์ PDF
                    </button>
                </div>
            </div>

            <div class="space-y-3" id="history-list"></div>
        </div>

    </main>

    <footer class="bg-white border-t py-3 text-center text-sm font-bold text-slate-500 no-print">
        ระบบจัดการแปลงเกษตรอัจฉริยะ (Smart Farm)
    </footer>

    <script>
        let currentPlotId = 1;

        function loadPlotDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            currentPlotId = Number(urlParams.get('id')) || 1;

            const plots = JSON.parse(localStorage.getItem('farm_plots') || '[]');
            const plot = plots.find(p => p.id === currentPlotId) || plots[0];

            if (plot) {
                document.getElementById('detail-plot-name').innerText = '🌾 ' + plot.name;
                document.getElementById('detail-crop-info').innerText = `พืช: ${plot.crop || 'ไม่ได้ระบุ'} (${plot.size} ไร่)`;
                document.getElementById('detail-start-date').innerText = plot.plant_date || '-';
                document.getElementById('detail-harvest-date').innerText = plot.harvest_date || '-';
            }

            renderHistory();
        }

        function renderHistory() {
            const activities = JSON.parse(localStorage.getItem('farm_activities') || '[]');
            const plotActivities = activities.filter(a => a.plot_id === currentPlotId);
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            if (plotActivities.length === 0) {
                historyList.innerHTML = '<p class="text-center text-slate-500 font-bold py-4">ยังไม่มีประวัติบันทึกงาน</p>';
                return;
            }

            plotActivities.forEach(item => {
                historyList.innerHTML += `
<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-center space-x-4">
<span class="text-4xl p-2 bg-emerald-100 rounded-xl">${item.icon || '✅'}</span>
<div>
<p class="text-2xl font-extrabold text-slate-800">${item.name}</p>
<p class="text-lg font-bold text-slate-500">บันทึกเมื่อ: ${item.date}</p>
</div>
</div>
                `;
            });
        }

        function recordActivity(activityName, icon) {
            alert('✅ บันทึกกิจกรรม "' + activityName + '" เรียบร้อยแล้ว!');
            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.';

            let activities = JSON.parse(localStorage.getItem('farm_activities') || '[]');
            activities.unshift({ plot_id: currentPlotId, name: activityName, icon: icon, date: dateStr });

            localStorage.setItem('farm_activities', JSON.stringify(activities));
            renderHistory();
        }

        function exportCSV() {
            const activities = JSON.parse(localStorage.getItem('farm_activities') || '[]');
            const plotActivities = activities.filter(a => a.plot_id === currentPlotId);
            let csvContent = "\uFEFFกิจกรรม,วันที่บันทึก\n";
            plotActivities.forEach(a => {
                csvContent += `"${a.name}","${a.date}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `ประวัติงาน_แปลง_${currentPlotId}.csv`;
            link.click();
        }
    </script>
</body>

</html>
