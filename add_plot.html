<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มแปลงเกษตร - เกษตรอัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html"
                class="flex items-center space-x-2 bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-xl text-white transition">
                <span class="text-2xl">⬅️</span>
                <span class="font-extrabold text-lg">หน้าแรก</span>
            </a>
            <h1 class="text-xl font-extrabold">เพิ่มแปลงเกษตร</h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 w-full space-y-6">

        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-4">
            <h2 class="text-2xl font-extrabold text-slate-800 border-b pb-3">🌱 กรอกข้อมูลแปลงใหม่</h2>

            <form onsubmit="saveNewPlot(event)" class="space-y-4">
                <div>
                    <label class="block text-lg font-extrabold text-slate-700 mb-1">ชื่อแปลงเกษตร</label>
                    <input type="text" id="plot-name" placeholder="เช่น แปลงผักสวนครัว B1"
                        class="w-full text-xl p-4 rounded-xl border-2 border-slate-300 bg-slate-50 font-bold" required>
                </div>
                <div>
                    <label class="block text-lg font-extrabold text-slate-700 mb-1">ขนาดพื้นที่ (ไร่)</label>
                    <input type="number" id="plot-size" step="0.1" placeholder="เช่น 3.5"
                        class="w-full text-xl p-4 rounded-xl border-2 border-slate-300 bg-slate-50 font-bold" required>
                </div>
                <div>
                    <label class="block text-lg font-extrabold text-slate-700 mb-1">พืชที่ปลูก</label>
                    <input type="text" id="plot-crop" placeholder="เช่น ข้าวโพดหวาน"
                        class="w-full text-xl p-4 rounded-xl border-2 border-slate-300 bg-slate-50 font-bold" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-lg font-extrabold text-slate-700 mb-1">วันที่เริ่มปลูก</label>
                        <input type="date" id="plot-start"
                            class="w-full text-lg p-4 rounded-xl border-2 border-slate-300 bg-slate-50 font-bold"
                            required>
                    </div>
                    <div>
                        <label class="block text-lg font-extrabold text-slate-700 mb-1">คาดว่าเก็บเกี่ยว</label>
                        <input type="date" id="plot-harvest"
                            class="w-full text-lg p-4 rounded-xl border-2 border-slate-300 bg-slate-50 font-bold"
                            required>
                    </div>
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-2xl py-4 rounded-xl shadow-md transition active:scale-95">
                    ✅ ยืนยันเพิ่มแปลงเกษตร
                </button>
            </form>
        </div>

    </main>

    <script>
        function saveNewPlot(e) {
            e.preventDefault();
            const plots = JSON.parse(localStorage.getItem('farm_plots') || '[]');
            const newPlot = {
                id: Date.now(),
                name: document.getElementById('plot-name').value,
                size: document.getElementById('plot-size').value,
                crop: document.getElementById('plot-crop').value,
                status: 'PLANTING',
                plant_date: document.getElementById('plot-start').value,
                harvest_date: document.getElementById('plot-harvest').value
            };

            plots.push(newPlot);
            localStorage.setItem('farm_plots', JSON.stringify(plots));
            alert('✅ เพิ่มแปลงเกษตรใหม่เรียบร้อยแล้ว!');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
