<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Smart Farm Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body
    class="bg-slate-900 min-h-screen flex items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&auto=format&fit=crop&q=80')] bg-cover bg-center relative">

    <!-- Dark Overlay สำหรับเพิ่มมิติและให้อ่านข้อความง่ายขึ้น -->
    <div
        class="absolute inset-0 bg-gradient-to-br from-emerald-950/80 via-slate-900/75 to-teal-950/85 backdrop-blur-sm">
    </div>

    <!-- Container หลัก -->
    <div class="w-full max-w-md relative z-10">

        <!-- Card สำหรับหน้าเข้าสู่ระบบ / สมัครสมาชิก -->
        <div id="auth-card"
            class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 border border-white/20">
            <!-- Header & Logo -->
            <div class="text-center mb-6">
                <div
                    class="w-20 h-20 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-3xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-600/30 ring-4 ring-emerald-100/50">
                    <i class="fa-solid fa-wheat-awn text-white text-4xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Smart Farm Pro</h1>
                <p class="text-xs text-emerald-700 font-semibold mt-1">ระบบจัดการแปลงเกษตรอัจฉริยะ</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex gap-2 mb-6 bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80">
                <button id="tab-login" onclick="toggleTab('login')"
                    class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-emerald-700 text-white shadow-md transition-all duration-200">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i> เข้าสู่ระบบ
                </button>
                <button id="tab-register" onclick="toggleTab('register')"
                    class="flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all duration-200">
                    <i class="fa-solid fa-user-plus mr-1.5"></i> สมัครสมาชิก
                </button>
            </div>

            <!-- 1. ฟอร์มเข้าสู่ระบบ (Login Form) -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-phone text-emerald-600 mr-1"></i> เบอร์โทรศัพท์
                    </label>
                    <input type="tel" id="login-phone" placeholder="เช่น 0812345678" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-key text-emerald-600 mr-1"></i> รหัสผ่าน
                    </label>
                    <input type="password" id="login-pass" placeholder="••••••••" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-emerald-700/30 hover:shadow-emerald-700/50 transition-all duration-200 active:scale-[0.99]">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- 2. ฟอร์มสมัครสมาชิก (Register Form) -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-id-card text-emerald-600 mr-1"></i> ชื่อ - นามสกุล
                    </label>
                    <input type="text" id="reg-name" placeholder="นายเกษตร สมาร์ทฟาร์ม" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-phone text-emerald-600 mr-1"></i> เบอร์โทรศัพท์
                    </label>
                    <input type="tel" id="reg-phone" placeholder="08xxxxxxxx" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-wheat-field text-emerald-600 mr-1"></i> ชื่อฟาร์ม / แปลงเกษตร
                    </label>
                    <input type="text" id="reg-farm" placeholder="เช่น ฟาร์มผักไฮโดรโปนิกส์" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-key text-emerald-600 mr-1"></i> กำหนดรหัสผ่าน
                    </label>
                    <input type="password" id="reg-pass" placeholder="กำหนดรหัสผ่าน" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 font-medium transition">
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-emerald-700/30 hover:shadow-emerald-700/50 transition-all duration-200 active:scale-[0.99]">
                    ยืนยันสมัครสมาชิก
                </button>
            </form>

            <!-- Quick Demo Accounts (ปุ่มทางลัดทดลองเข้าสู่ระบบ) -->
            <div class="mt-6 pt-5 border-t border-slate-200/80">
                <p class="text-xs font-bold text-slate-500 mb-3 text-center">
                    <i class="fa-solid fa-bolt text-amber-500 mr-1"></i> บัญชีทดสอบที่ฝังในโค้ด (กดเพื่อเข้าใช้ทันที)
                </p>
                <div class="grid grid-cols-1 gap-2" id="demo-buttons">
                    <!-- ปุ่มทดสอบจะถูกสร้างโดยอัตโนมัติด้วย JavaScript -->
                </div>
            </div>
        </div>

        <!-- Card สำหรับแสดงผลหลังเข้าสู่ระบบ (Logged In State) -->
        <div id="user-profile-card"
            class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 border border-white/20 hidden">
            <div class="text-center space-y-4">
                <div
                    class="w-24 h-24 bg-gradient-to-tr from-amber-400 to-emerald-500 rounded-full flex items-center justify-center mx-auto p-1 shadow-lg">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80"
                        alt="Avatar" class="w-full h-full object-cover rounded-full border-2 border-white">
                </div>
                <div>
                    <span
                        class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                        <i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i> เข้าสู่ระบบสำเร็จ
                    </span>
                    <h2 id="display-name" class="text-xl font-extrabold text-slate-800 mt-2">--</h2>
                    <p id="display-role" class="text-xs font-semibold text-amber-600">--</p>
                </div>

                <!-- ข้อมูล Session ที่ถูกบันทึกไว้ใน localStorage -->
                <div
                    class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-left space-y-2 text-xs text-slate-700">
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-slate-500"><i class="fa-solid fa-phone mr-1"></i> เบอร์โทรศัพท์:</span>
                        <span id="display-phone" class="font-bold">--</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-slate-500"><i class="fa-solid fa-wheat-field mr-1"></i> ชื่อแปลง/ฟาร์ม:</span>
                        <span id="display-farm" class="font-bold text-emerald-700">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-500"><i class="fa-solid fa-clock mr-1"></i> เวลาที่ล็อกอิน:</span>
                        <span id="display-login-time" class="font-bold">--</span>
                    </div>
                </div>

                <div class="pt-2 space-y-2">
                    <a href="index.html"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wheat-field"></i> เข้าสู่หน้าจัดการแปลงเกษตร
                    </a>
                    <button onclick="handleLogout()"
                        class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-rose-600/30 transition">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> ออกจากระบบ (Clear Session)
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. กำหนดข้อมูลบัญชีผู้ใช้เริ่มต้น (ฝังลงในโค้ด)
        const PRESET_USERS = [
            {
                name: "อติวิชญ์ คำมูลใจ",
                phone: "0680235930",
                pass: "123456",
                role: "เกษตรกร (Smart Farmer)",
                farmName: "แปลงเกษตรอัจฉริยะ ม.พะเยา"
            },
            {
                name: "ดร.ณัฐพล หาญสมุทร",
                phone: "0899999999",
                pass: "123456",
                role: "ผู้จัดการฟาร์ม (Farm Manager)",
                farmName: "ฟาร์มสาธิตวิศวกรรมซอฟต์แวร์"
            }
        ];

        // 2. เมื่อโหลดหน้าเว็บ: ทำการเตรียมข้อมูลและตรวจสอบ Session การล็อกอิน
        window.addEventListener('DOMContentLoaded', () => {
            initPresetUsers();
            renderDemoButtons();
            checkSessionState();
        });

        // ฝังบัญชีเริ่มต้นลง localStorage ถ้ายังไม่มีข้อมูล
        function initPresetUsers() {
            PRESET_USERS.forEach(user => {
                const key = `farm_user_${user.phone}`;
                if (!localStorage.getItem(key)) {
                    localStorage.setItem(key, JSON.stringify(user));
                }
            });
        }

        // สร้างปุ่มทางลัดสำหรับทดลองเข้าสู่ระบบ
        function renderDemoButtons() {
            const container = document.getElementById('demo-buttons');
            container.innerHTML = PRESET_USERS.map(user => `
                <button type="button" onclick="quickLogin('${user.phone}')"
                        class="w-full flex items-center justify-between px-3 py-2 bg-slate-100 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-300 rounded-xl text-left transition group">
                    <div>
                        <div class="text-xs font-bold text-slate-800 group-hover:text-emerald-800">${user.name}</div>
                        <div class="text-[10px] text-slate-500">${user.role} • ${user.farmName}</div>
                    </div>
                    <span class="text-[11px] font-bold bg-emerald-700 text-white px-2 py-1 rounded-lg">คลิกเพื่อเข้าใช้</span>
                </button>
            `).join('');
        }

        // 3. สลับหน้าเข้าสู่ระบบ / สมัครสมาชิก (Tab Switching)
        function toggleTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            const activeStyle = "flex-1 py-2.5 text-sm font-bold rounded-xl bg-emerald-700 text-white shadow-md transition-all duration-200";
            const inactiveStyle = "flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all duration-200";

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = activeStyle;
                tabRegister.className = inactiveStyle;
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = activeStyle;
                tabLogin.className = inactiveStyle;
            }
        }

        // 4. ระบบเข้าสู่ระบบ (Login Handler)
        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const pass = document.getElementById('login-pass').value;

            processLogin(phone, pass);
        }

        // ฟังก์ชั่นทางลัดเข้าสู่ระบบด้วยคลิกเดียว
        function quickLogin(phone) {
            const userStore = JSON.parse(localStorage.getItem(`farm_user_${phone}`));
            if (userStore) {
                processLogin(userStore.phone, userStore.pass);
            }
        }

        // ประมวลผลและเก็บบันทึกข้อมูลลงใน Session (localStorage)
        function processLogin(phone, pass) {
            const storedData = localStorage.getItem(`farm_user_${phone}`);

            if (!storedData) {
                alert('❌ ไม่พบบัญชีเบอร์โทรศัพท์นี้ กรุณาสมัครสมาชิกก่อน');
                return;
            }

            const user = JSON.parse(storedData);
            if (user.pass !== pass) {
                alert('❌ รหัสผ่านไม่ถูกต้อง');
                return;
            }

            // สร้างวัตถุ Session สำหรับเก็บสถานะการเข้าใช้งานปัจจุบัน
            const sessionData = {
                name: user.name,
                phone: user.phone,
                role: user.role || "เกษตรกร (Farmer)",
                farmName: user.farmName || "แปลงเกษตรอัจฉริยะ",
                loginTime: new Date().toLocaleString('th-TH'),
                isLoggedIn: true
            };

            // **บันทึกข้อมูลไว้ใน localStorage (Key: current_user)**
            localStorage.setItem('current_user', JSON.stringify(sessionData));

            alert(`🎉 ยินดีต้อนรับคุณ ${user.name} เข้าสู่ระบบสำเร็จ!`);
            checkSessionState();
        }

        // 5. ระบบสมัครสมาชิก (Register Handler)
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const farmName = document.getElementById('reg-farm').value.trim();
            const pass = document.getElementById('reg-pass').value;

            // ตรวจสอบเบอร์ซ้ำ
            if (localStorage.getItem(`farm_user_${phone}`)) {
                alert('⚠️ เบอร์โทรศัพท์นี้ถูกใช้งานแล้ว กรุณาใช้เบอร์อื่น หรือเข้าสู่ระบบ');
                return;
            }

            // สร้างข้อมูลผู้ใช้ใหม่และบันทึกลง localStorage
            const newUser = {
                name: name,
                phone: phone,
                farmName: farmName,
                pass: pass,
                role: "เกษตรกร (Farmer)",
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem(`farm_user_${phone}`, JSON.stringify(newUser));

            alert('✅ สมัครสมาชิกสำเร็จ! ระบบจะทำการเข้าสู่ระบบให้อัตโนมัติ');
            processLogin(phone, pass);
        }

        // 6. ตรวจสอบสถานะการล็อกอินและแสดงผลหน้าโปรไฟล์
        function checkSessionState() {
            const currentSession = localStorage.getItem('current_user');
            const authCard = document.getElementById('auth-card');
            const profileCard = document.getElementById('user-profile-card');

            if (currentSession) {
                const user = JSON.parse(currentSession);

                // แสดงข้อมูลผู้ใช้ที่ดึงมาจาก localStorage
                document.getElementById('display-name').innerText = user.name;
                document.getElementById('display-role').innerText = user.role;
                document.getElementById('display-phone').innerText = user.phone;
                document.getElementById('display-farm').innerText = user.farmName;
                document.getElementById('display-login-time').innerText = user.loginTime;

                // สลับการแสดงผลการ์ด
                authCard.classList.add('hidden');
                profileCard.classList.remove('hidden');
            } else {
                authCard.classList.remove('hidden');
                profileCard.classList.add('hidden');
            }
        }

        // 7. ระบบออกจากระบบ (Logout)
        function handleLogout() {
            if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
                // ลบข้อมูล Session การเข้าใช้งาน
                localStorage.removeItem('current_user');
                alert('ออกจากระบบเรียบร้อยแล้ว');
                checkSessionState();
            }
        }
    </script>
</body>
</html>
